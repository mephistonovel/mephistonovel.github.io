    Selected Research Projects:
      - name: Conformal uncertainty and patient-specific retesting
        highlights:
          - "Originated the motivating use case and led experimental design: constructed semi-synthetic data from real sepsis data and designed a
            risk score with patient-specific retesting needs."
          - Compared retest-variable selection using total attribution, equal calibration/instance weighting, and greater instance weighting; showed
            that emphasizing the test instance better prioritized patient-specific retest variables under a limited testing budget in simulation.
        bullet: "**Conformal uncertainty and patient-specific retesting**. Originated the motivating use case and led experimental design: constructed
          semi-synthetic data from real sepsis data and designed a risk score with patient-specific retesting needs. Compared retest-variable selection
          using total attribution, equal calibration/instance weighting, and greater instance weighting; showed that emphasizing the test instance
          better prioritized patient-specific retest variables under a limited testing budget in simulation."
      - name: Instrumental variable representation learning under confounded covariates
        highlights:
          - Conceived the research question and designed an architecture to learn IV representations from high-dimensional covariates correlated with
            unobserved confounders, targeting causal effect estimation under weaker assumptions.
          - Implemented the model, ran the experiments, and wrote the manuscript, carrying the project from initial concept through empirical evaluation.
        bullet: "**Instrumental variable representation learning under confounded covariates**. Conceived the research question and designed an
          architecture to learn IV representations from high-dimensional covariates correlated with unobserved confounders, targeting causal effect
          estimation under weaker assumptions. Implemented the model, ran the experiments, and wrote the manuscript, carrying the project from initial
          concept through empirical evaluation."
      - name: Reliability of AI-enhanced satellite imagery as evidence
        highlights:
          - Investigated the reliability of AI-enhanced satellite imagery for international criminal accountability; ran model inference across 15
            super-resolution setups and conducted quantitative and qualitative analyses.
          - Combined quantitative and qualitative evidence of reliability limitations with analysis of international criminal accountability, highlighting
            risks of the evaluated AI-enhanced imagery as evidence; manuscript under review.
        bullet: "**Reliability of AI-enhanced satellite imagery as evidence**. Investigated the reliability of AI-enhanced satellite imagery for
          international criminal accountability; ran model inference across 15 super-resolution setups and conducted quantitative and qualitative
          analyses. Combined quantitative and qualitative evidence of reliability limitations with analysis of international criminal accountability,
          highlighting risks of the evaluated AI-enhanced imagery as evidence; manuscript under review."
